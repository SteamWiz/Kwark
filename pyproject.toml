[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "kwark"
description = "Tap into AI brilliance from a simple shell command"
authors = ["Steampunk Wizard <kwark@steamwiz.io>"]
license = "MIT"
readme = "PACKAGE.md"
version = "3.0.1"
homepage = 'https://steamwiz.io'
repository = 'https://github.com/SteamWiz/Kwark'

[tool.poetry.dependencies]
python = "^3.14"
wizlib = "^4.0.8"
pyyaml = "^6.0.3"
anthropic = "^0.75.0"
mcp = {version = "^1.25.0", optional = true}

[tool.poetry.extras]
mcp = ["mcp"]

[tool.poetry.group.dev.dependencies]
pycodestyle = "^2.11.0"
autopep8 = "^2.0.4"
coverage = "^7.3.0"
pytest = "^9.0.2"
mcp = "^1.25.0"

[tool.poetry.scripts]
kwark = "kwark:KwarkApp.main"

[tool.semantic_release]
version_toml = ["pyproject.toml:tool.poetry.version"]
tag_format = "v{version}"
build_command = ""

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.remote.token]
env = "GH_TOKEN"

[tool.semantic_release.publish]
upload_to_vcs_release = false
